name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows: los tests usan rutas reales de Windows (C:\Jarvis, D:\Descargas...)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      JARVIS_EVALS_LIVE: "0"   # los evals siempre con mocks; nunca se llama a la API
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # El alias de proyecto "jarvis" apunta a C:\Jarvis: unos tests leen el propio repo
      - name: Enlazar C:\Jarvis al checkout
        shell: pwsh
        run: New-Item -ItemType Junction -Path C:\Jarvis -Target $env:GITHUB_WORKSPACE | Out-Null

      - name: Compilar
        shell: pwsh
        run: python -m py_compile (Get-ChildItem *.py, skills\*.py).FullName

      - name: Tests con mocks
        run: python -m unittest discover -s tests -q

      # En el runner no hay audio, Ollama ni credenciales: los ERROR son esperados.
      # Solo se comprueba que el doctor se ejecuta y produce JSON válido.
      - name: Doctor (JSON válido)
        run: >-
          python -c "import json, subprocess, sys;
          r = subprocess.run([sys.executable, 'doctor.py', '--json'], capture_output=True, timeout=120);
          d = json.loads(r.stdout);
          assert r.returncode in (0, 1) and d['version'] == 1, r.returncode;
          print('doctor exit', r.returncode, d['estado'], d['resumen'])"

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # token automático del run, no un secreto propio
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
